<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Chatbot Example</title>
  <link rel="stylesheet" href="chatbot-widget.css">
</head>
<body>
  <audio id="pop-sound" src="https://cdn.glitch.global/01a66850-f583-4369-9887-fcb7f2aecbf6/323743__reitanna__mouth-pop5.wav?v=1716411364280" preload="auto"></audio>
   <div id="calendly-widget-container" style="display:none;">
    <button id="back-to-chatbot">Back to Chatbot</button>
<iframe src="https://api.leadconnectorhq.com/widget/booking/5usXHkjq0gvwbjJiGpxG" allow="payment" style="width: 100%;border:none;overflow: hidden;" scrolling="no" id="5usXHkjq0gvwbjJiGpxG_1788362905565"></iframe><br><script src="https://link.msgsndr.com/js/form_embed.js" type="text/javascript"></script>
<iframe src="https://api.leadconnectorhq.com/widget/booking/HLMw8mX0D7aEwofqcDXQ" allow="payment" style="width: 100%;border:none;overflow: hidden;" scrolling="no" id="HLMw8mX0D7aEwofqcDXQ_1788363017537"></iframe><br><script src="https://link.msgsndr.com/js/form_embed.js" type="text/javascript"></script>
  </div>
  <div id="chat-widget" style="display: none;">
    <div class="tour-booking">
      <a href="#" id="book-tour-link">Click here to book a tour</a>
    </div>
    <div class="chatbot-header">
      <div class="chatbot-header-line">
        <div>
          <div class="chat-box-title-line">
            <h4 class="chat-box-title">AI Assistant</h4>
          </div>
          <p id="intro">
            Hi, I am a personal AI assistant, ask me anything you want to know about Kids World Learning Center!
          </p>
        </div>
      </div>
    </div>
    <div id="chatbox"></div>
    <form id="chat-form">
      <input type="text" id="chat-input" value="Ask a question" />
      <button type="submit" id="messagebtn">
      </button>
    </form>
  </div>
    <div id="location-buttons-container" style="display:none;">
      <p id="loc">
        Select a location to tour:
      </p>
    <button class="location-button" id="btn1" data-target="5usXHkjq0gvwbjJiGpxG_1788362905565">Iron Bridge location</button>
    <button class="location-button" id="btn2" data-target="HLMw8mX0D7aEwofqcDXQ_1788363017537">Providence location</button>
  </div>
  <script defer src="chatbot-widget.js"></script>
 
</body>
</html>
